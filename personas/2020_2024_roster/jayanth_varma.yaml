  \ while ensuring that inflation remains within the target going forward.\" (2020-10-09)"
- "\"A sub 3% short rate (corresponding to a negative real interest rate of \u2212\
  4.5%) risks encouraging speculative inventory accumulation and stoking inflationary\
  \ buildup in sectors that are showing incipient anecdotal signs of cartelization\
  \ and resurgence of pricing power.\" (2020-12-04)"
- "\"Turning to the resolution, I indicated in my individual statement for the October\
  \ 2020 meeting that monetary policy must remain accommodative \u201Cas long as realized\
  \ outcomes do not diverge drastically from what is currently expected.\u201D It\
  \ must be admitted that realized growth and inflation have both drifted towards\
  \ the edge of the fan charts while remaining within them.\" (2020-12-04)"
